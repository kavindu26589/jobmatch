[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobmatcher"
version = "0.1.0"
description = "Agentic job-matching and resume-improvement system built on opencode-gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4",
  "langgraph>=0.2.6",
  "pypdf>=5.0,<6.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1",
  "typer>=0.13,<1.0",
  "rich>=13.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "reportlab>=4.1,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatcher"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/jobmatcher"]
exclude = ["src/jobmatcher/agents/graph.py"]