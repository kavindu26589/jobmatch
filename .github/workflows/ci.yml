name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e gateway -e "app[dev]"

      - name: Ruff lint
        run: ruff check gateway app tests

      - name: Ruff format check
        run: ruff format --check gateway app tests

      - name: mypy
        run: mypy gateway/src app/src

      - name: Pytest (offline)
        run: pytest -q -m "not live"